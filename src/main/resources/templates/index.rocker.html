@import cn.hutool.json.JSONObject
@import cn.hutool.json.JSONUtil;
@args (JSONObject data, RockerBody content)

<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理系统</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/assets/css/main.css">
</head>
<body>
<!-- 通知容器 -->
<div class="toast-container" id="toastContainer"></div>

<div class="container">
    <div class="header">
        <h1 class="title">代理管理系统</h1>
    </div>

    <!-- 工具栏 -->
    <div class="toolbar">
        <div class="toolbar-actions">
            <button class="btn btn-primary" id="addAgentBtn">
                <i class="fas fa-plus"></i> 添加代理
            </button>
        </div>

    </div>

    <!-- 数据表格 -->
    <div class="card">
        <div class="card-header">
            <h2 class="card-title">代理列表</h2>
            <button class="btn btn-outline" id="refreshBtn">
                <i class="fas fa-sync-alt"></i> 刷新
            </button>
        </div>
        <div class="card-body">
            <div class="table-container">
                <table class="data-table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>主机地址</th>
                        <th>端口</th>
                        <th>URI</th>
                        <th>动作</th>
                        <th>类型</th>
                        <th>API Key</th>
                        <th>操作</th>
                    </tr>
                    </thead>
                    <tbody id="agentTableBody">
                    <!-- 数据将通过JavaScript动态加载 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- 添加/编辑代理模态框 -->
<div class="modal-overlay" id="agentModal">
    <div class="modal">
        <div class="modal-header">
           <!-- <h3 class="modal-title" id="modalTitle">添加代理</h3>
            <button class="modal-close" id="modalClose">&times;</button>-->
        </div>
        <div class="modal-body">
            <form id="agentForm">
                <input type="hidden" id="agentId">
                <div class="form-group">
                    <label for="hosts" class="form-label">主机地址</label>
                    <input type="text" id="hosts" class="form-control" required>
                    <div class="form-error" id="hostsError"></div>
                </div>
                <div class="form-group">
                    <label for="port" class="form-label">端口</label>
                    <input type="number" id="port" class="form-control" min="1" max="65535" required>
                    <div class="form-error" id="portError"></div>
                </div>
                <div class="form-group">
                    <label for="uri" class="form-label">URI</label>
                    <input type="text" id="uri" class="form-control" required>
                    <div class="form-error" id="uriError"></div>
                </div>
                <div class="form-group">
                    <label for="action" class="form-label">action</label>
                    <input type="text" id="action" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="type" class="form-label">类型</label>
                    <select id="type" class="form-control" required>
                        <option value="0">类型 0</option>
                        <option value="1">类型 1</option>
                    </select>
                    <div class="form-error" id="typeError"></div>
                </div>
                <div class="form-group">
                    <label for="apikey" class="form-label">API Key</label>
                    <input type="text" id="apikey" class="form-control" required>
                    <div class="form-error" id="apikeyError"></div>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline" id="cancelBtn">取消</button>
            <button class="btn btn-primary" id="saveBtn">保存</button>
        </div>
    </div>
</div>



<!-- 查看代理详情模态框 -->
<div class="modal-overlay" id="viewAgentModal">
    <div class="modal">
        <div class="modal-header">
            <h3 class="modal-title">代理详情</h3>
            <button class="modal-close" id="viewModalClose">&times;</button>
        </div>
        <div class="modal-body">
            <div id="agentDetails">
                <!-- 代理详情将通过JavaScript动态加载 -->
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline" id="closeViewBtn">关闭</button>
        </div>
    </div>
</div>
<input value="@data" type="hidden" id="4s" ></input>
<script>


              // 初始数据
              let agentData =JSON.parse($("#4s").val());



              let filteredAgents = [];
              let currentAgentId = null;

              $(document).ready(function() {
                  // 初始化
                  initializeApp();

                  // 绑定事件
                  bindEvents();
              });

              // 初始化应用
              function initializeApp() {
                  // 初始化过滤后的代理列表
                  filteredAgents = agentData.agents;

                  // 渲染代理表格
                  renderAgentTable();
              }

              // 绑定事件
              function bindEvents() {
                  // 搜索功能
                  $("#searchInput").on('input', function() {
                      applyFilters();
                  });

                  // 类型筛选
                  $("#typeFilter").change(function() {
                      applyFilters();
                  });

                  // 重置筛选
                  $("#resetFilters").click(function() {
                      $("#typeFilter").val('');
                      $("#searchInput").val('');
                      applyFilters();
                  });

                  // 刷新按钮
                  $("#refreshBtn").click(function() {
                      renderAgentTable();
                      showToast('success', '刷新成功', '代理列表已刷新');
                  });

                  // 添加代理按钮
                  $("#addAgentBtn").click(function() {
                      openAddAgentModal();
                  });

                  // 模态框关闭按钮
                  $("#modalClose, #cancelBtn").click(function() {
                      closeModal("agentModal");
                  });

                  // 保存代理按钮
                  $("#saveBtn").click(function() {
                      saveAgent();
                  });

                  // 查看代理详情
                  $(document).on('click', '.view-agent', function() {
                      const agentId = $(this).data('id');
                      openViewAgentModal(agentId);
                  });

                  // 编辑代理
                  $(document).on('click', '.edit-agent', function() {
                      const agentId = $(this).data('id');
                      openEditAgentModal(agentId);
                  });

                  // 删除代理
                  $(document).on('click', '.delete-agent', function() {
                      const agentId = $(this).data('id');
                      openDeleteConfirmModal(agentId);
                  });

                  // 关闭查看详情模态框
                  $("#viewModalClose, #closeViewBtn").click(function() {
                      closeModal("viewAgentModal");
                  });

                  // 取消删除
                  $("#cancelDeleteBtn").click(function() {
                      closeModal("deleteConfirmModal");
                  });

                  // 确认删除
                  $("#confirmDeleteBtn").click(function() {
                      deleteAgent();
                  });
              }

              // 应用筛选
              function applyFilters() {
                  const typeFilter = $("#typeFilter").val();
                  const searchTerm = $("#searchInput").val().toLowerCase();

                  filteredAgents = agentData.agents.filter(agent => {
                      const matchesType = !typeFilter || agent.type === typeFilter;
                      const matchesSearch = !searchTerm ||
                          agent.hosts.toLowerCase().includes(searchTerm) ||
                          agent.uri.toLowerCase().includes(searchTerm) ||
                          agent.apikey.toLowerCase().includes(searchTerm) ||
                          agent.id.toString().includes(searchTerm);

                      return matchesType && matchesSearch;
                  });

                  renderAgentTable();
              }

              // 渲染代理表格
              function renderAgentTable() {
                  const tableBody = $("#agentTableBody");
                  tableBody.empty();
                  console.log(filteredAgents);
                  filteredAgents.forEach(agent => {
                      const typeClass = agent.type === "0" ? 'status-0' : 'status-1';
                      const typeText = agent.type === "0" ? '测试机' : '目标机';
                      const shortApiKey = agent.apikey && agent.apikey.length > 20 ?
                          agent.apikey.substring(0, 20) + '...' : agent.apikey;

                      const row = `
                          <tr data-id="${agent.id}">
                              <td>${agent.id}</td>
                              <td>${agent.hosts}</td>
                              <td>${agent.port}</td>
                              <td>${agent.uri}</td>
                              <td>${agent.action}</td>
                              <td><span class="status ${typeClass}">${typeText}</span></td>
                              <td>
                                  <span class="api-key" title="${agent.apikey}" onclick="copyToClipboard('${agent.apikey}')">
                                      ${shortApiKey}
                                  </span>
                              </td>
                              <td>
                                  <div class="table-actions">
                                      <button class="btn-action btn-view view-agent" title="查看" data-id="${agent.id}">
                                          <i class="fas fa-eye"></i>
                                      </button>
                                      <button class="btn-action btn-edit edit-agent" title="编辑" data-id="${agent.id}">
                                          <i class="fas fa-edit"></i>
                                      </button>
                                      <button class="btn-action btn-delete delete-agent" title="删除" data-id="${agent.id}">
                                          <i class="fas fa-trash-alt"></i>
                                      </button>
                                  </div>
                              </td>
                          </tr>
                      `;
                      tableBody.append(row);
                  });
              }

              // 打开添加代理模态框
              function openAddAgentModal() {
                  // 重置表单
                  $("#agentForm")[0].reset();
                  $("#agentId").val('');

                  // 清除错误信息
                  clearFormErrors();

                  // 设置模态框标题
                  $("#modalTitle").text("添加代理");

                  // 打开模态框
                  openModal("agentModal");
              }

              // 打开编辑代理模态框
              function openEditAgentModal(agentId) {
                  // 查找代理
                  const agent = findAgentById(agentId);
                  if (!agent) return;

                  // 填充表单
                  $("#agentId").val(agent.id);
                  $("#hosts").val(agent.hosts);
                  $("#port").val(agent.port);
                  $("#uri").val(agent.uri);
                  $("#type").val(agent.type);
                  $("#apikey").val(agent.apikey);

                  // 清除错误信息
                  clearFormErrors();

                  // 设置模态框标题
                  $("#modalTitle").text("编辑代理");

                  // 打开模态框
                  openModal("agentModal");
              }

              // 打开查看代理详情模态框
              function openViewAgentModal(agentId) {
                  // 查找代理
                  const agent = findAgentById(agentId);
                  if (!agent) return;

                  // 生成详情HTML
                  const typeText = agent.type === "0" ? '类型 0' : '类型 1';
                  const detailsHtml = `
                      <div style="font-size: 1rem; line-height: 1.8;">
                          <p><strong>ID:</strong> ${agent.id}</p>
                          <p><strong>主机地址:</strong> ${agent.hosts}</p>
                          <p><strong>端口:</strong> ${agent.port}</p>
                          <p><strong>URI:</strong> ${agent.uri}</p>
                          <p><strong>类型:</strong> <span class="status ${agent.type === "0" ? 'status-0' : 'status-1'}">${typeText}</span></p>
                          <p><strong>API Key:</strong> <span class="api-key" onclick="copyToClipboard('${agent.apikey}')">${agent.apikey}</span></p>
                      </div>
                  `;

                  // 填充详情
                  $("#agentDetails").html(detailsHtml);

                  // 打开模态框
                  openModal("viewAgentModal");
              }

              // 打开删除确认对话框
              function openDeleteConfirmModal(agentId) {
                  // 保存当前要删除的代理ID
                  currentAgentId = agentId;

                  // 打开确认对话框
                  openModal("deleteConfirmModal");
              }

              // 保存代理
              function saveAgent() {
                  // 获取表单数据
                  const agentId = $("#agentId").val();
                  const hosts = $("#hosts").val().trim();
                  const port = $("#port").val();
                  const uri = $("#uri").val().trim();
                  const type = $("#type").val();
                  const apikey = $("#apikey").val().trim();

                  // 验证表单
                  let isValid = true;

                  if (!hosts) {
                      showFormError("hosts", "主机地址不能为空");
                      isValid = false;
                  }

                  if (!port || port < 1 || port > 65535) {
                      showFormError("port", "端口必须在1-65535之间");
                      isValid = false;
                  }

                  if (!uri) {
                      showFormError("uri", "URI不能为空");
                      isValid = false;
                  }

                  if (!apikey) {
                      showFormError("apikey", "API Key不能为空");
                      isValid = false;
                  }

                  if (!isValid) return;

                  // 创建代理对象
                  const agent = {
                      id: agentId || generateId(),
                      hosts,
                      port: parseInt(port),
                      uri,
                      type,
                      apikey
                  };

                  // 保存代理
                  if (agentId) {
                      // 更新现有代理
                      updateAgent(agent);
                      showToast('success', '更新成功', '代理已成功更新');
                  } else {
                      // 添加新代理
                      addAgent(agent);
                      showToast('success', '添加成功', '代理已成功添加');
                  }

                  // 关闭模态框
                  closeModal("agentModal");

                  // 重新渲染表格
                  renderAgentTable();
              }

              // 添加代理
              function addAgent(agent) {
                  // 添加到代理列表
                  agentData.agents.push(agent);
                  agentData.total++;

                  // 更新过滤后的代理列表
                  applyFilters();
              }

              // 更新代理
              function updateAgent(agent) {
                  // 查找代理索引
                  const index = agentData.agents.findIndex(a => a.id === agent.id);
                  if (index === -1) return;

                  // 更新代理
                  agentData.agents[index] = agent;

                  // 更新过滤后的代理列表
                  applyFilters();
              }

              // 删除代理
              function deleteAgent() {
                  if (!currentAgentId) return;

                  // 查找代理索引
                  const index = agentData.agents.findIndex(a => a.id === currentAgentId);
                  if (index === -1) return;

                  // 删除代理
                  agentData.agents.splice(index, 1);
                  agentData.total--;

                  // 更新过滤后的代理列表
                  applyFilters();

                  // 关闭确认对话框
                  closeModal("deleteConfirmModal");

                  // 显示通知
                  showToast('success', '删除成功', '代理已成功删除');

                  // 重置当前代理ID
                  currentAgentId = null;
              }

              // 根据ID查找代理
              function findAgentById(agentId) {
                  return agentData.agents.find(agent => agent.id === agentId);
              }

              // 生成唯一ID
              function generateId() {
                  // 查找最大ID
                  const maxId = Math.max(...agentData.agents.map(a => parseInt(a.id)));

                  // 返回新ID
                  return (maxId + 1).toString();
              }

              // 显示表单错误
              function showFormError(field, message) {
                  $(`#${field}Error`).text(message);
              }

              // 清除表单错误
              function clearFormErrors() {
                  $(".form-error").text('');
              }

              // 打开模态框
              function openModal(modalId) {
                  $(`#${modalId}`).addClass('active');
              }

              // 关闭模态框
              function closeModal(modalId) {
                  $(`#${modalId}`).removeClass('active');
              }

              // 复制API Key到剪贴板
              function copyToClipboard(text) {
                  if (navigator.clipboard) {
                      navigator.clipboard.writeText(text).then(function() {
                          showToast('success', '复制成功', 'API Key已复制到剪贴板');
                      }).catch(function() {
                          fallbackCopyToClipboard(text);
                      });
                  } else {
                      fallbackCopyToClipboard(text);
                  }
              }

              // 降级复制方案
              function fallbackCopyToClipboard(text) {
                  const textArea = document.createElement('textarea');
                  textArea.value = text;
                  textArea.style.position = 'fixed';
                  textArea.style.left = '-999999px';
                  textArea.style.top = '-999999px';
                  document.body.appendChild(textArea);
                  textArea.focus();
                  textArea.select();

                  try {
                      document.execCommand('copy');
                      showToast('success', '复制成功', 'API Key已复制到剪贴板');
                  } catch (err) {
                      showToast('error', '复制失败', '无法复制到剪贴板');
                  }

                  document.body.removeChild(textArea);
              }

              // 显示通知
              function showToast(type, title, message) {
                  const toastContainer = document.getElementById('toastContainer');

                  const icon = type === 'success' ? 'check-circle' :
                             type === 'error' ? 'times-circle' :
                             type === 'info' ? 'info-circle' : 'exclamation-circle';

                  const toast = document.createElement('div');
                  toast.className = `toast toast-${type}`;
                  toast.innerHTML = `
                      <div class="toast-icon">
                          <i class="fas fa-${icon}"></i>
                      </div>
                      <div class="toast-content">
                          <div class="toast-title">${title}</div>
                          <div class="toast-message">${message}</div>
                      </div>
                      <button class="toast-close" onclick="this.parentElement.remove()">&times;</button>
                  `;

                  toastContainer.appendChild(toast);

                  setTimeout(() => {
                      toast.classList.add('show');
                  }, 100);

                  setTimeout(() => {
                      toast.classList.remove('show');
                      setTimeout(() => {
                          if (toast.parentElement) {
                              toast.remove();
                          }
                      }, 300);
                  }, 3000);
              }
</script>
</body>
</html>
